name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python scripts/validate_data.py data/seed_train.jsonl --kind train
      - run: python scripts/validate_data.py data/eval.jsonl --kind eval
      - run: python scripts/validate_data.py data/profile_train.jsonl --kind train
      - run: python scripts/validate_data.py data/profile_eval.jsonl --kind eval
      - run: python -m unittest discover -s tests -v
